name: Next.js CI/CD

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: 'client cicd'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache npm packages
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      # ✅ Lấy tag name từ Git (ví dụ: v1.0.0)
      - name: Extract Git tag
        run: echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # ✅ Build Docker image (multi-stage build từ Dockerfile của bạn)
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/jobmanagement-client:${{ env.IMAGE_TAG }} .

      # ✅ Push image theo tag (ví dụ: v1.0.0)
      - name: Push Docker image (version tag)
        run: docker push ${{ secrets.DOCKER_USERNAME }}/jobmanagement-client:${{ env.IMAGE_TAG }}

      # Deploy on VPS
      - name: Deploy on vps
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PASS }}
          script: |
            cd /home/linh/deploy
            ./deploy-client.sh ${{ env.IMAGE_TAG }}
